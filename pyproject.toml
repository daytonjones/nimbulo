[project]
name = "nimbulo"
version = "0.3.0"
description = "Manage logins across AWS, GCP, Azure, OCI, Vultr, and DigitalOcean from CLI/TUI/GUI"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dayton Jones", email = "jones.dayton@gmail.com" }]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "textual>=0.74",
    "pyside6>=6.7",
    "keyring>=25.0",
    "requests>=2.32",
    "pyyaml>=6.0",
    "qt-material>=2.14",
]

[project.urls]
Repository = "https://github.com/daytonjones/nimbulo"

[project.scripts]
nimbulo = "nimbulo:main"

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest", "ruff", "twine"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
# Recovered baseline source is kept verbatim (only additive OCI edits). Files written for
# OCI (providers/oci.py, providers/oci_config.py, ui/oci_form.py) and tests get full lint.
"src/nimbulo/__init__.py" = ["E501", "F401", "I001"]
"src/nimbulo/__main__.py" = ["E501", "F401", "I001"]
"src/nimbulo/models.py" = ["E501", "F401", "I001"]
"src/nimbulo/secrets.py" = ["E501", "F401", "I001"]
"src/nimbulo/settings.py" = ["E501", "F401", "I001"]
"src/nimbulo/providers/__init__.py" = ["E501", "F401", "I001"]
"src/nimbulo/providers/aws.py" = ["E501", "F401", "I001"]
"src/nimbulo/providers/azure.py" = ["E501", "F401", "I001"]
"src/nimbulo/providers/base.py" = ["E501", "F401", "I001"]
"src/nimbulo/providers/digitalocean.py" = ["E501", "F401", "I001"]
"src/nimbulo/providers/gcp.py" = ["E501", "F401", "I001"]
"src/nimbulo/providers/vultr.py" = ["E501", "F401", "I001"]
"src/nimbulo/ui/cli.py" = ["E501", "F401", "I001"]
"src/nimbulo/ui/gui.py" = ["E501", "F401", "I001"]
"src/nimbulo/ui/menubar.py" = ["E501", "F401", "I001"]
"src/nimbulo/ui/tui.py" = ["E501", "F401", "I001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
